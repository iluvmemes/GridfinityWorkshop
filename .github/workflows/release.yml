on:
  push:
    tags:
      - '*'
name: Handle Release
permissions:
  contents: read
jobs:
  generate-installer:
    name: Create release-artifacts
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create zip file for manual installation
        uses: vimtor/action-zip@5407800dfb2b1b37d48df912330cb22f4ab6f422 # v1.3
        with:
          files: GridfinityWorkshop.manifest GridfinityWorkshop.py config.py LICENSE.md lib/ commands/ documentation/PRIVACY_POLICY.md
          recursive: false
          dest: dist/GridfinityWorkshop-${{ github.ref_name }}.zip
      - name: Attest release archive provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Upload the artifacts
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          body: TBD
          prerelease: true
