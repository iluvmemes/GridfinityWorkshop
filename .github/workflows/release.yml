on:
  push:
    tags:
      - '*'
name: Handle Release
permissions:
  contents: read
jobs:
  generate-installer:
    name: Create release-artifacts
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create zip file for manual installation
        uses: vimtor/action-zip@1379ea20d4c5705669ba81fd626dd01b1c738f26 # v1.2
        with:
          files: GridfinityWorkshop.manifest GridfinityWorkshop.py config.py LICENSE.md lib/ commands/ documentation/PRIVACY_POLICY.md
          recursive: false
          dest: dist/GridfinityWorkshop-${{ github.ref_name }}.zip
      - name: Attest release archive provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.zip
      - name: Upload the artifacts
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          body: TBD
          prerelease: true
