<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live bin preview</title>
<script src="vendor/three-runtime.js" defer></script><script src="three-demo.js?v=1" defer></script>
<style>*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;color:#254356;background:#f3f7fa}header{padding:16px 20px;background:white;border-bottom:1px solid #d9e4eb}h1{font-size:19px;margin:0 0 5px}p{margin:4px 0;color:#587487;font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 76px)}aside{padding:20px;background:white;overflow:auto}label{display:block;margin-bottom:19px;font-size:12px}input[type=number]{width:100%;padding:8px;border:1px solid #bfd1dd;border-radius:6px;margin-top:6px}input[type=range]{width:100%;accent-color:#297ea8;margin-top:10px}.checks{display:flex;gap:7px;align-items:center}button{padding:8px 12px;border:1px solid #b8cedb;border-radius:6px;background:#f2f9fd;color:#225974;cursor:pointer}main{position:relative;min-width:0;min-height:0}#canvas{position:absolute;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%}.caption{position:absolute;left:18px;bottom:16px;right:18px;pointer-events:none;background:#ffffffdc;border:1px solid #d9e4eb;border-radius:9px;padding:11px 14px}#status{font-size:12px}#error{color:#a1392e}strong{font-weight:600}.muted{margin-top:22px;line-height:1.5}@media(max-width:600px){.layout{grid-template-columns:155px 1fr}aside{padding:12px}header{padding:12px}.caption{left:8px;right:8px}}
</style></head><body><header><h1>Standard bin / live 3D study</h1><p>Drag to orbit · Scroll to zoom · Geometry is calculated locally as you edit</p></header><div class="layout"><aside>
<label>Length / grid cells<input id="cols" type="number" min="1" max="6" step="1" value="2"></label>
<label>Width / grid cells<input id="rows" type="number" min="1" max="6" step="1" value="2"></label>
<label>Height <strong id="height-label">6U / 42 mm</strong><input id="height" type="range" min="2" max="20" step="1" value="6"></label>
<label class="checks"><input id="scoop" type="checkbox" checked>Scoop</label>
<label>Scoop radius <strong id="radius-label">25 mm</strong><input id="radius" type="range" min="2" max="40" step="1" value="25"></label>
<label class="checks"><input id="rim" type="checkbox" checked>Stacking rim</label>
<button id="reset">Fit view</button><p class="muted">Approximate shape preview. Feet and stacking rim are simplified. No Fusion geometry is created; no print or export action.</p><p id="error" role="alert"></p>
</aside><main><div id="canvas"></div><div class="caption"><strong id="dimensions"></strong><p id="status" role="status">Starting WebGL...</p><p id="scoop-note"></p></div></main></div></body></html>
